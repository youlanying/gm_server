<script type="text/javascript">
$(document).ready(function(){
	
	var time = 5000;
	function Callback(data){
		var obj = eval(data);
		//console.log("CMD: "+ obj.cmd + "\nNUM: "+ obj.num);
		//alert("CMD: "+ obj.cmd + "\nNUM: "+ obj.num);
	};
	function checkRoleNum(){
		var CmdUrl = "{{.cmdurl}}";
		var FullUrl = CmdUrl + "zxlf_get?cmd=gm_get_role_num&auth=301b35660e7ebded3078fd1db101e8fe&gm=gm001&time=1448023962";
		$.ajax({
			url:FullUrl,
			type:'GET',
			dataType:'JSONP',
			jsonpCallback:'Callback',
			cache:false,
			success:function(obj){
				if(obj.num > 0){
					console.log("CMD: "+ obj.cmd + "\nNUM: "+ obj.num);
					//alert("CMD: "+ obj.cmd + "\nNUM: "+ obj.num);
					setTimeout(checkRoleNum, time);
				}else{
					alert("Kick Role Over!");
				}
			}
		});
	};
	function KickRole(){
		var CmdUrl = "{{.cmdurl}}";
		var FullUrl = CmdUrl + "zxlf_get?cmd=kick_role_js&auth=301b35660e7ebded3078fd1db101e8fe&gm=gm001&time=1448023962";
		$.ajax({
			url:FullUrl,
			type:'GET',
			dataType:'JSONP',
			jsonpCallback:'Callback',
			cache:false,
			success:function(obj){
				if(obj.currolenum > 0){
					console.log("CMD: "+ obj.cmd + "\nNUM: "+ obj.currolenum);
					//alert("CMD: "+ obj.cmd + "\nNUM: "+ obj.num);
					setTimeout(checkRoleNum, time);
				}else{
					alert("Kick Role Over!");
					window.location.href = "{% url action="show" platform=platform %}";
				}
			}
		});
	};
	function SendBroadcast(){
		var CmdUrl = "{{.cmdurl}}";
		var FullUrl = CmdUrl + "zxlf_get?cmd=gm_send_broadcast_js&content=30秒后服务器关闭！请马上下线！&type=1&num=1&auth=301b35660e7ebded3078fd1db101e8fe&gm=gm001&time=1448023962";
		$.ajax({
			url:FullUrl,
			type:'GET',
			dataType:'JSONP',
			jsonpCallback:'Callback',
			cache:false,
			success:function(obj){
				if(obj.result == "ok"){
					console.log("CMD: "+ obj.cmd + "\nRESULT: "+ obj.result);
					//alert("CMD: "+ obj.cmd + "\nNUM: "+ obj.num);
					setTimeout(KickRole, 30000);
				}else{
					alert("Send Broadcast Failed...");
				}
			}
		});
	};
	$("#btn_kick").click(function(){
		//alert("btn_click click!");
		//$("#form_kick").submit();
		SendBroadcast();
	});
	
});
</script>

<div class="mws-panel grid_4">
    <div class="mws-panel-header">
        <span> 服务器踢人下线 </span>
    </div>
    <div class="mws-panel-body no-padding">
        
            <fieldset class="mws-form-inline">
                <legend> 服务器信息: </legend>
                <div class="mws-form-row bordered">
                    <label class="mws-form-label"> ViewId </label>
                    <div class="mws-form-item">
                        <input type="text" class="large" name="viewid" id="viewid" readonly="readonly" value="{{.viewid}}" />
                    </div>
                </div>
                <div class="mws-form-row bordered">
                    <label class="mws-form-label"> ServerId </label>
                    <div class="mws-form-item">
                        <input type="text" class="large" name="serverid" id="serverid" readonly="readonly" value="{{.serverid}}" />
                    </div>
                </div>
                <div class="mws-form-row bordered">
                    <label class="mws-form-label"> ServerName </label>
                    <div class="mws-form-item">
                        <input type="text" class="large" name="serverid" id="serverid" readonly="readonly" value="{{.servername}}" />
                    </div>
                </div>
                <div class="mws-form-row bordered">
                    <label class="mws-form-label"> State </label>
                    <div class="mws-form-item">
                        {{range $index, $mem := .statelist }}
							{{if eq $mem.stateid .state}}
								<input type="text" class="large" name="state" id="state" readonly="readonly" value="{{$mem.statestr}}" />
							{{end}}
                        {{end}}
                    </div>
                </div>
                <div class="mws-form-row bordered">
                    <label class="mws-form-label"> 操作： </label>
                    <div class="mws-form-message warning">
                        {{.showmsg}}
                    </div>
                </div>
            </fieldset>
            <div class="mws-button-row">
            	<form class="mws-form" id="form_kick" method="post" action="pfselect/dokick">
					<input type="hidden" name="platform" value="{{.selectpf}}" />
					<input type="hidden" name="serid" value="{{.viewid}}" />
					<input type="hidden" name="acttype" value="1" />
					<input type="button" value="确定" class="btn btn-danger" id="btn_kick" />
                </form>
                <form class="mws-form" id="form_cancel" method="post" action="pfselect/dokick">
					<input type="hidden" name="platform" value="{{.selectpf}}" />
					<input type="hidden" name="serid" value="{{.viewid}}" />
					<input type="hidden" name="acttype" value="0" />
					<input type="submit" value="取消" class="btn " />
                </form>
            </div>
    </div>      
</div>
