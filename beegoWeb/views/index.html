	<link rel="stylesheet" type="text/css" href="/static/css/fonts/icomoon/style.css" media="screen">

	<link rel="stylesheet" type="text/css" href="/static/css/login.css" media="screen">

	<link rel="stylesheet" type="text/css" href="/static/css/mws-theme.css" media="screen">

    <!-- Plugin Stylesheets first to ease overrides -->

    <link rel="stylesheet" type="text/css" href="/static/css/mws-style.css" media="screen">

    <!-- jQuery-UI Stylesheet -->
    <link rel="stylesheet" type="text/css" href="/static/jui/css/jquery.ui.all.css" media="screen">
    <link rel="stylesheet" type="text/css" href="/static/jui/jquery-ui.custom.css" media="screen">

    <link rel="stylesheet" type="text/css" href="/static/css/themer.css" media="screen">

    <script src="/static/js/libs/jquery-1.8.3.min.js"></script>

    <!-- jQuery-UI Dependent Scripts -->

    <!-- Plugin Scripts -->
    <script src="/static/plugins/colorpicker/colorpicker-min.js"></script>
    <script src="/static/plugins/validate/jquery.validate-min.js"></script>

    <!-- Core Script -->
    <script src="/static/bootstrap/js/bootstrap.min.js"></script>
    <script src="/static/js/core/mws.js"></script>

    <!-- Themer Script (Remove if not needed) -->
    <script src="/static/js/core/themer.js"></script>

    <script src="/static/js/jquery.cookie.min.js"></script>
    <!-- Login Script -->
    <script src="/static/js/core/login.js"></script>

	<script>
		$(document).ready(function(){
			$("#formLogin").keypress(function(e){
				var curKey = e.which;
				if (curKey == 13) {
					if($("#labID").val().trim() == ""){
						alert("用户名不能为空！");
					}else if($("#labPwd").val().trim() == ""){
						alert("密码不能为空！");
					}else{
						$("#formLogin").submit();
					}
				}
			});
			$("#btnLogin").click(function(){
				if($("#labID").val().trim() == ""){
					alert("用户名不能为空！");
				}else if($("#labPwd").val().trim() == ""){
					alert("密码不能为空！");
				}else{
					$("#formLogin").submit();
				}
			});
		});

       window.onload = function(){
            errMsg = {{.errMsg}}
            console.log("errMsg is " + errMsg );
            if(errMsg)
            {
                alert(errMsg);
            }
        }
	</script>

    <title>GM后台管理系统</title>

</head>

<body>

    <div id="mws-login-wrapper">
        <div id="mws-login">
            <h1>Login</h1>
            <div class="mws-login-lock"><i class="icon-lock"></i></div>
            <div id="mws-login-form">
                <!-- form class="mws-form" id="formLogin" action="dashboard.html" method="post" -->
                <form class="mws-form" id="formLogin" method="post" action="/login">
                    <div class="mws-form-row">
                        <div class="mws-form-item">
                            <input type="text" id="labID" name="username" class="mws-login-username required" placeholder="username">
                        </div>
                    </div>
                    <div class="mws-form-row">
                        <div class="mws-form-item">
                            <input type="password" id="labPwd" name="password" class="mws-login-password required" placeholder="password">
                        </div>
                    </div>
                    <div id="mws-login-remember" class="mws-form-row mws-inset">
                        <ul class="mws-form-list inline">
                            <li>
                                <input id="remember" type="checkbox"> 
                                <label for="remember">Remember me</label>
                            </li>
                        </ul>
                    </div>
                    <div class="mws-form-row">
                        <input type="submit" id="btnLogin" value="Login" class="btn btn-success mws-login-button">
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
