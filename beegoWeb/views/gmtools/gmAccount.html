<script>
    $.fn.setDefauleValue = function() {
        var defauleValue = $(this).val();
        $(this).val(defauleValue).css("color","#999");
        return this.each(function(){
            $(this).focus(function(){
                if ($(this).val() == defauleValue){
                    $(this).val("").css("color","#000");
                }
            }).blur(function(){
                if ($(this).val() == ""){
                    $(this).val(defauleValue).css("color","#999");
                }
            });
        });
    };
$(document).ready(function(){

    {{if .send }}
        alert("{{.send}}");
    {{end}}

     $("#mws-form-dialog").dialog({
                autoOpen: false,
                title: "请选择",
                modal: true,
                width: "640",
                buttons: [{
                    text: "关闭",
                    click: function () {
                        $(this).dialog("close");
                    }
                }]
            });

    $(":radio").click(function(){
        $("#cmdurl").val($(this).val());
    });

    $("#selectID").change(function(){
        //var selecttext =$("#selectID").find("option:selected").text();
        var selecttext =$("#selectID").val();
        $("#divurl").find("ul").attr("style",'display:none');
        $("#"+selecttext).attr("style",'display:');
        //alert(selecttext);
    });

    function GetGMAccount(){
        var CmdUrl =  $("#cmdurl").val();
        var FullUrl = CmdUrl + "zxlf_get?cmd=gm_white_gm_account&type=get";
        $.ajax({
            url:FullUrl,
            type:'GET',
            dataType:'JSONP',
            cache:false,
            success:function(obj){
                $("#output").html(obj.result);
                $("#div1").attr("style",'display:');
                $("#div2").attr("style",'display:');
                $("#btn_set").attr("style",'display:');
                
            }
        });
    };
   

    $("#btn_new").click(function(){
        if ($("#cmdurl").val().trim() == "") {
            alert("cmdurl不能为空！");
        }else if($("#cmdurl").val().trim() == "例: http://127.0.0.1:9010/"){
            alert("cmdurl不能为空！");
        }else{
            GetGMAccount();
        }
    }); 

    $("#btn_set").click(function(){
        if ($("#cmdurl").val().trim() == "") {
            alert("cmdurl不能为空！");
        }else if($("#cmdurl").val().trim() == "例: http://127.0.0.1:9010/"){
            alert("cmdurl不能为空！");
         }else if($("#account").val().trim() == ""){
            alert("GM账号不能为空！");    
        }else{
            var con = confirm("确认设定GM账号？");
                if (con==true) {
                     $("#form_new").submit();                
                };       
        }
    }); 

    $("#cmdurl").setDefauleValue();

});


</script>

<div id="div_create">
	<div class="mws-panel grid_4">
        <div class="mws-panel-header">
            <span>GM玩家设置查询</span>
        </div>
        <div class="mws-panel-body no-padding">
            <form class="mws-form" id="form_new" method="post" action="/gmtools/gm_account/">
                <fieldset class="mws-form-inline">               
                    <div class="mws-form-row bordered">
                        <label class="mws-form-label">cmdurl :</label>
                        <div class="mws-form-item">
                           <input style='width:50%' type="text"  class="large" name="cmdurl" id="cmdurl" value="例: http://127.0.0.1:9010/" />
                           <input type="button" id="mws-form-dialog-mdl-btn" class="btn btn-success" value="url选择">
                        </div>                                         
                    </div>
                     <div class="mws-form-row bordered" id="div1" style="display:none">
                        <label class="mws-form-label">当前GM账号:</label>
                        <div class="mws-form-item">
                           <textarea id="output" style='width:65%' rows="" cols="" class="large" disabled="disabled"></textarea>                      
                        </div>                        
                    </div>
                    <div class="mws-form-row bordered" id="div2" style="display:none">
                        <label class="mws-form-label">设置GM账号:</label>
                        <div class="mws-form-item">
                           <input type="text"  class="large" name="account" id="account"  />                       
                        </div>  
                         <div class="mws-form-item">                                 
                           <label >可设置多个账号账号间用@符号隔开 1@2 不要有空格，同时将完全清除之前已设置账号！</label> 
                           <label >只输入@时为清空GM账号</label>                
                        </div>                               
                    </div>
                </fieldset>
                <div class="mws-button-row">
                    <input type="button" value="查询GM玩家账号" class="btn btn-danger" id="btn_new"/> <input type="button" value="提交GM玩家账号" class="btn btn-danger" id="btn_set" style="display:none"/> 
                </div>
            </form>

            <div id="mws-form-dialog">
             <form id="mws-validate" class="mws-form" action="">
                <div class="mws-form-row bordered">
                                    <label class="mws-form-label">平台列表</label>
                                    <div class="mws-form-item">
                                        <select id="selectID" class="large">
                                            <option value="">请选择</option>
                                            {{ range $vIndex,$cMem1 := .centerurl }}
                                            <option value={{$vIndex}}>{{$cMem1.PlatformName}}</option>
                                            {{end}}
                                        </select>
                                    </div>
                                </div>
                <div class="mws-form-block">
                    <div class="mws-form-row">
                        <label class="mws-form-label"></label>
                        <div class="mws-form-item clearfix" id="divurl">
                            {{ range $vvIndex,$cMem2 := .centerurl }}
                            <ul class="mws-form-list inline" id={{$vvIndex}} style="display:none">
                                {{ range $_,$cMemMem := $cMem2.ServerList }}
                                <li><input  type="radio" name="gender" class="required" value = {{$cMemMem.Scmdurl}}> <label for="gender_male">{{$cMemMem.Sserver_name}}</label></li>                                
                                {{end}}
                            </ul>
                            {{end}}
                        </div>                                 
                    </div>
                </div>
                </form>    
            </div>

        </div>      
    </div>
</div>
