<script>
$(document).ready(function() {  

     $("#mws-form-dialog").dialog({
                autoOpen: false,
                title: "请选择",
                modal: true,
                width: "640",
                buttons: [{
                    text: "关闭",
                    click: function () {
                        $(this).dialog("close");
                    }
                }]
            });

    $(":radio").click(function(){
        $("#cmdurl").val($(this).val());
    });

    $("#selectID").change(function(){
        //var selecttext =$("#selectID").find("option:selected").text();
        var selecttext =$("#selectID").val();
        $("#divurl").find("ul").attr("style",'display:none');
        $("#"+selecttext).attr("style",'display:');
        //alert(selecttext);
    });


    {{ if .result }}
        alert("{{.result}}");
    {{end}}

    $("#btn_new").click(function(){
        if ($("#cmdurl").val().trim() == "") {
            alert("cmdurl不能为空！");
        }else if ($("#cmdurl").val().trim() == "例: http://127.0.0.1:9010/") {
            alert("cmdurl不能为空！");    
        }else if ($("#roleid").val().trim() == "") {
            alert("用户ID不能为空！");
        }else if ($("#roleid").val().trim() == "例: 17659294908430") {
            alert("用户ID不能为空！");    
        }else if ($("#protoid").val().trim() == "") {
            alert("道具ID不能为空！");
        }else if ($("#level").val().trim() == "") {
            alert("道具等级不能为空！");
        }else if ($("#itemnum").val().trim() == "") {
            alert("道具数量不能为空！");    
        }else{
            if (isNaN($("#roleid").val().trim()) || isNaN($("#protoid").val().trim()) || isNaN($("#level").val().trim()) || isNaN($("#itemnum").val().trim()))
            {
                alert('填写错误请检查！');
                return false;
            };
            var con = confirm("确认删除？");
            if (con==true) {
                $("#form_new").submit();
            };    
        };
    });

    $("#cmdurl").setDefauleValue();
    $("#roleid").setDefauleValue();

});

$.fn.setDefauleValue = function() {
    var defauleValue = $(this).val();
    $(this).val(defauleValue).css("color","#999");
    return this.each(function(){
        $(this).focus(function(){
            if ($(this).val() == defauleValue){
                $(this).val("").css("color","#000");
            }
        }).blur(function(){
            if ($(this).val() == ""){
                $(this).val(defauleValue).css("color","#999");
            }
        });
    });
}    
</script>


<div id="div_create">
	<div class="mws-panel grid_4">
        <div class="mws-panel-header">
            <span>删除道具</span>
        </div>
        <div class="mws-panel-body no-padding">
            <form class="mws-form" id="form_new" method="post" action="/gmtools/delitem/">
                <fieldset class="mws-form-inline">               
                    <div class="mws-form-row bordered">
                        <label class="mws-form-label">cmdurl :</label>
                        <div class="mws-form-item">
                           <input type="text" class="large" name="cmdurl" id="cmdurl" value="例: http://127.0.0.1:9010/" />
                           <input type="button" id="mws-form-dialog-mdl-btn" class="btn btn-success" value="url选择">
                        </div>                                        
                    </div>
                    <div class="mws-form-row bordered">
                        <label class="mws-form-label">用户ID :</label>
						<div class="mws-form-item">
							<input type="text" class="large" name="roleid" id="roleid" value="例: 17659294908430"/>
						</div>
                    </div>
                   <div class="mws-form-row bordered">
                        <label class="mws-form-label">道具protoid :</label>
						<div class="mws-form-item">
							<input type="text" class="large" name="protoid" id="protoid" />
						</div>
                    </div>
                    <div class="mws-form-row bordered">
                        <label class="mws-form-label">道具等级 :</label>
						<div class="mws-form-item">                            
							<input type="text" class="large" name="level" id="level" value="1" />
						</div>
                    </div>
                   <div class="mws-form-row bordered">
                        <label class="mws-form-label">道具数量 :</label>
                        <div class="mws-form-item">
                            <input type="text" class="large" name="itemnum" id="itemnum" value="1" />
                        </div>
                    </div>
                </fieldset>
                <div class="mws-button-row">                    
                    <input type="button" value="删除" class="btn btn-danger" id="btn_new"/>
                </div>
            </form>

            <div id="mws-form-dialog">
             <form id="mws-validate" class="mws-form" action="">
                <div class="mws-form-row bordered">
                                    <label class="mws-form-label">平台列表</label>
                                    <div class="mws-form-item">
                                        <select id="selectID" class="large">
                                            <option value="">请选择</option>
                                            {{range $vIndex,$cMem1 := .centerurl}}
                                            <option value={{$vIndex}}>{{$cMem1.PlatformName}}</option>
                                            {{end}}
                                        </select>
                                    </div>
                                </div>
                <div class="mws-form-block">
                    <div class="mws-form-row">
                        <label class="mws-form-label"></label>
                        <div class="mws-form-item clearfix" id="divurl">
                            {{range $vvIndex,$cMem2 := .centerurl}}
							<ul class="mws-form-list inline" id={{$vvIndex}} style="display:none">
								{{ range $_,$cMemMem := $cMem2.ServerList }}
								<li><input  type="radio" name="gender" class="required" value = {{$cMemMem.Scmdurl}}> <label for="gender_male">{{$cMemMem.Sserver_name}}</label></li>                                
								{{end}}
							</ul>
                            {{end}}
                        </div>                                 
                    </div>
                </div>
                </form>    
            </div>

            
        </div>      
    </div>
</div>
